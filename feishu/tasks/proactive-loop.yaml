# Link16 Portable Task Template · Proactive 24h Closed-Loop
# 归属 Link16 仓库（跨机器、跨平台通用），任何电脑启用 Proactive 均参照本文件与 docs/SOP-150-proactive-agent-loop.md。
task_id: link16-proactive-loop
version: 7
sop: docs/SOP-150-proactive-agent-loop.md
taste: docs/TASTE-010-proactive-dispatch.md
owner_repo: link16-agent-infra

# 由绑定此模式的工作台主号在收到本人晨间新业务或晨审请求时执行。
morning_review:
  arrange_command: python feishu/proactive_business_list.py arrange --round-json <本轮业务登记.json>
  check_command: python feishu/proactive_business_list.py check --round-json <本轮业务登记.json> --bullets <准备贴出的文本.txt>
  mode: 本人要求梳理或排业务时显式选 arrange_business。对话原样使用命令通过的要点，工作台读取同一登记；退回时纠正具体行再验。普通消息及执行回报直接走原流程。
  intake: 先以要点列出每项业务、唯一登记负责人和预期交付物，同一清单原位进入工作台，供本人逐项核对。
  order: 新增批次置顶，同一事项保留原键和原作者，旧项保持相对顺序并连续编号。
  coordination: 消息联系实际对口人；本人另行指定约会时才安排日程。业务内按步骤接续，文件、媒体和获准消息随同一作者。
  delivery: 作者回执与实物进入本人验收；预期交付与实际结果分列。本人确认业务才归档，待发消息按核准原文发送，审批交原单或可恢复的本人草稿。
  validation: 每次生成及发布前验证同一业务数据和成品四列。无实测的结果留空，实测为零保留零值；不合格版本停在发布前。

# 各来源分别记录身份、授权及实读范围。
preflight:
  command: python feishu/proactive_scanner.py --bot <bot> --preflight-only
  required_capabilities:
    - chat_read          # im:message.p2p_msg/group_msg:get_as_user, search:message
    - wiki_and_minutes   # wiki:space:retrieve/node:read/retrieve, minutes:minutes.search:read, vc:meeting.search:read
    - doc_sheet_write    # sheets:spreadsheet:write_only, base:record:create/update, docx:document:write_only, docs:document.comment:create
    - reaction_as_user   # im:message.reactions:write_only
    # 本人网页外发在业务主机另行安装并获授权时启用。
  optional_extended_capabilities:
    - web_send_as_user   # 仅在已安装可验证的本人发送组件时启用
    - native_approval    # 按目标应用验证定义、实例与审批任务权限
    - miaoda_and_tasks   # spark:app:read/write/publish, task:task:read/readonly/tasklist:read
    - web_level4_domains # feishu/feishu_web_workbench.py (假勤考勤 / 飞书邮箱 / 飞书 OKR 网页端通道)

# 阶段 1：挂载到本机 feishu/cron-jobs/<bot>.yaml 的标准定时任务模板
cron_template:
  name: proactive-board-refresh
  cron: "0 9 * * *"
  tz: Asia/Shanghai
  enabled: true
  prompt: >
    使用本人指定的主号。先读 Link16 的 docs/SOP-150-proactive-agent-loop.md 和 docs/TASTE-010-proactive-dispatch.md，再核私有登记中的来源、成品及收件人。
    按来源恢复上次成功时间窗，核周报最新手写行、本人私聊及定向群请求、已结束日历与临时会议、
    纪要和逐字稿收尾、真实待办与审批以及已派 peer 的回执。核归属、产物与截止后按优先级派单，业务查看、实施和验收全部分派，
    按物品或业务事项给稳定 item，模型、文档、GIF、回填、验收及获准消息由同一作者完成；不同物品独立并行，发布者只上架。转交先取旧作者停笔及封存回执，将旧单剩余要求并入唯一责任单；保存原件基线。每单依主动工作台 skill 实际调用 feishu/proactive_followup.py 登记 next_check，
    以原回执判断在途、重估和办理；过期缺回复要查原因并主动唤醒主号。设计任务连同次日续单都要交代已验原模型和原 HTML/PRD，明确基线与点名范围。
    规格沿原章节、表格列序、行序及样式，只写功能、定义、数值和单位；一项新增功能增一行，对应视角的 GIF 回原功能格。采购分工和推算过程归工作记录。把新成果、缺件及回执合并进原工作台，
    启用 morning_review 的主号按该段处理当轮新业务。收到明确约会指令的日历执行者先核人、忙闲和房间。已订阅线上工作台的主号从本机私有登记核对原应用 ID、固定 URL、本人和上次验收的可部署版本。
    比对本轮移动稿摘要；与已验收线上内容相同时复查原入口，跳过重复发布。候选页与附件先核本人访问、匿名拒绝、本人专属范围和手机阅读。
    只向同一应用发布通过的版本；公开页面、脚本及匿名响应不得含企业或个人数据。候选验证失败保留上版，本地照常更新。
    发布回执不明先查原回执；发布后复核固定入口、附件和版本，再登记为已验收。复核失败恢复上一可部署版本并回读，逐项记录实际结果。
    用 proactive_dispatch.py overview 核本机状态，按近期派工回执更新 fleet_history 的机器、执行者与任务。空闲保留最近分工，远端以带时刻的回执区分执行与交付。
    按 owner_closed_keys 和本人新决定去重。同一项业务在 business_rows 注册唯一执行者、实际结果、原稿与设计媒体；没有成果的结果格留空。需本人选择的选项放审批区。
    发布有业务登记的工作台时对生成稿执行 proactive_taste.py workbench；采购消息预览及实发正文执行 proactive_taste.py message，失败回原作者修正。
    原工作台按 TASTE-010 和 SOP-150 自上而下呈现四列业务表、审批和项目日轴。按真实日期或已知区间分轨登记闭环会议及文件。执行者沿原派单回结论、验收范围及预览。主号派单、追单、接结论、维护工作台和发消息；同批合成一张本人私聊交互卡，各项编号并空一行。按 SOP 核对收件私聊、真实消息 ID 和卡片类型；每日巡检补漏。
    未获授权的对外沟通和审批提交保留待审。定时运行后台，不弹窗。

# 阶段 2 & 3：执行护栏
guardrails:
  retain_verified_sent_messages: true
  preview_before_sheet_or_doc_write: true
  require_owner_confirmation_before_send: true
  optional_user_send_tool: feishu/send_as_user_web.py
  verify_via_openapi_readback: true
