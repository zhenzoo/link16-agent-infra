# tb24-tennis-post 的定时任务 · cron-jobs/<bot>.yaml（bot 名=文件名·别在此重复写 bot）
# 加/改/停一项 = 编辑本文件 或用 `bridge_cron.py add/rm/enable/disable`；守护进程热读、免重启。
jobs:
- name: tennis-post-daily
  desc: 每天 00:05 触发 tennis-post【巡航】：总控开独立 worker 固定写【1 篇】网球公司拆解(读 PLAN-200 §2·先接在制期) → worker 必须跑到 _DONE.md
    → 总控亲验全闸 + 飞书成套交付主人 + 进度/巡航总结。GPT Image 最多2次但2/2不停工。机制见 docs/ARCH-300。(00:05 错开 xhs autopilot 的 00:00)
  cron: 5 0 * * *
  tz: Asia/Shanghai
  enabled: true
  prompt: '开启今天的 tennis post 巡航：按本仓 CLAUDE.md「🚀 巡航触发」+ docs/ARCH-300 §2 主循环跑——你当【总控】、自己不写帖，串行开子面板、每篇一个全新
    headless 会话写帖，本次【固定只写 1 篇】。触发后必须跑到成品并交付；别问确认、别自己写帖、别停。

    Step A 启动：echo $WMUX_PTY_ID > _autopilot/supervisor.pty 然后 python _autopilot/spawn_worker.py tag-self。

    Step B 定队列：读 docs/PLAN-200-master-roadmap.md §2 看写到哪、先接 posts/ 里在制未发期；没有在制才按弧顺序取下 1 篇(定 PNN+公司+slug、一句话记镜像)，不预取第2篇。

    Step C 写完这 1 篇：python _autopilot/spawn_worker.py spawn-writer PNN → 读 _autopilot/worker-prompt.md
    填占位符 → spawn_worker.py kickoff <pty> "<填好的提示词>" → 按 ARCH-300 §4 的当前 runtime 等待协议只等 _DONE.md；未 DONE
    就继续同一 worker，不因旧 _BLOCKED 或 GPT Image 2/2停工。 出了 _DONE 就亲跑 check_visual_assets/check_evidence_layout/imagegen_budget
    --final/check_cards/measure_all/taste_gate/check_copy/check_cover/check_titles/check_done（软件帖另加check_software），确认
    SPEC-210 回填；按卡片清单 send_feishu_media 发我(--to 我 open_id·封面在前) + 干净文案飞书在线文档 + 一条进度 DM。worker 面板留存供返修、不关。

    Step D 收尾：这 1 篇交付后发我巡航总结 DM(是谁/镜像/几张卡/哪些数走 ScraperAPI 或商店/flow实测/哪些渠道具体受阻/全闸复核/是否预算封顶视觉放行) → 停(固定1·绝不起第2篇)。

    GPT Image 规则：每期最多2次；2/2后选最佳登记结果并用本地HTML/CSS、真实素材裁切或确定性合成继续。只剩亮度/舞台光/暗部细节可保留Judge真实FAIL并审计放行；产品/Logo/文字/事实/尺寸/遮挡硬项继续本地修到过。异常自愈见
    ARCH-300 §6：worker限流/卡→kickoff注「继续」不/clear；真断网/欠费/服务路绝才DM我。

    '
- name: comment-factcheck-daily
  cron: 0 9 * * *
  tz: Asia/Shanghai
  enabled: false
  desc: 每天09:00拉 tennis-post 所有已发帖小红书评论→按 ARCH-240 §4 溯源定责→报主人建议(改帖 or 回评)·不擅自动手
  prompt: '每天 09:00 评论 fact-check（按本仓 docs/ARCH-240 §4 溯源闭环）：① 用 tikhub 拉 ZHEN好玩 账号所有已发帖的小红书评论——note IDs
    见 SPEC-210 发布记录（如 P001=6a47a0e3000000001c026797 / P005=6a4deb3e0000000007028953），没登记的先 tikhub search
    xhs ZHEN好玩 定位本人那几条；每帖 note xhs <id> --comments 拉全（楼中楼+ip_location）。② 跟上次比挑出【新增】评论里的事实性质疑（数字/参数/销量/实机/奖项/价格…），忽略灌水情绪。③
    逐条重新核查+溯源，定责四选一：源数据错/过期、agent 漂移(张冠李戴幻觉)、我们表述太满(单样本下全盘/把没查到当不存在/绝对化)、评论本身错(网友说反或误解)。平台内部数据(京东/淘宝销量评价)用
    browser-act chrome-direct 登录态核、亚马逊用 ScraperAPI，别只读糊弄。④ 汇成一条 DM 报我：每条质疑+证据+定责+建议措施(错在我们→改帖重传；错在评论→回评澄清)。先别擅自改帖或回评，等我点头。没有新质疑就报一句今日无新事实质疑。

    '
  disabled_reason: 主人手动暂停（2026-07-27 02:16 北京时间 · 经 tb24-ccp-config 执行）· 非故障 / 非自动停用 / 非跑挂了 —— 主人主动喊停全部定时任务。恢复：python
    feishu/bridge_cron.py enable --bot <bot> --name <name>
